/* =========================================
   PREVIEW DEL CARRUSEL
========================================= */

#carouselPreviewWrapper {
    position: relative;
    overflow: hidden;
}


/* =========================================
   PREVIEW PORTRAIT
========================================= */

#carouselPreview.scroll-container {

    display: flex;

    gap: 12px;

    overflow-x: auto;

    overflow-y: hidden;

    scroll-behavior: smooth;

    padding: 5px 2px 12px;

    scrollbar-width: thin;

}


/* =========================================
   PREVIEW LANDSCAPE
========================================= */

#carouselPreview.horizontal-scroll-container {

    display: flex;

    gap: 14px;

    overflow-x: auto;

    overflow-y: hidden;

    scroll-behavior: smooth;

    padding: 5px 2px 12px;

    scrollbar-width: thin;

}


/* =========================================
   POSTERS
========================================= */

#carouselPreview.scroll-container a {

    flex: 0 0 auto;

    width: 130px;

    position: relative;

}


#carouselPreview.scroll-container img {

    width: 130px;

    height: 200px;

    object-fit: cover;

    border-radius: 8px;

    display: block;

}


/* =========================================
   LANDSCAPE
========================================= */

#carouselPreview.horizontal-scroll-container a {

    flex: 0 0 auto;

    width: 260px;

    position: relative;

}


#carouselPreview.horizontal-scroll-container img {

    width: 260px;

    height: 146px;

    object-fit: cover;

    border-radius: 8px;

    display: block;

}


/* =========================================
   BOTÓN QUITAR
========================================= */

.preview-remove {

    position: absolute;

    top: 5px;

    right: 5px;

    width: 26px;

    height: 26px;

    border-radius: 50%;

    border: none;

    background: rgba(0,0,0,.8);

    color: white;

    font-size: 16px;

    cursor: pointer;

    z-index: 5;

}


.preview-remove:hover {

    background: #dc2626;

}


/* =========================================
   SCROLLBAR
========================================= */

#carouselPreview::-webkit-scrollbar {

}


#carouselPreview::-webkit-scrollbar-thumb {

    background: #475569;

    border-radius: 10px;

}


#carouselPreview::-webkit-scrollbar-track {

    background: transparent;

}

function escapeHTML(str) {
  return str ? str.replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m])) : '';
}

function generarSlug(str) {
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, "")
    .trim().replace(/\s+/g, "-");
}

function rellenarPlantilla(plantilla, datos) {
  return plantilla.replace(/\{\{(.*?)\}\}/g, (_, clave) => datos[clave.trim()] || '');
}

function limitarTexto(texto, maxCaracteres) {
  if (!texto) return '';
  return texto.length > maxCaracteres
    ? texto.slice(0, maxCaracteres).trim() + '...'
    : texto;
}

async function buscar() {
  const query = document.getElementById('searchInput').value.trim();
  const resultados = document.getElementById('resultados');
  resultados.innerHTML = '';

  if (!query) return alert("Escribe algo para buscar.");

  const tipoSeleccionado = document.getElementById('tipo').value;

  const res = await fetch(`https://api.themoviedb.org/3/search/${tipoSeleccionado}?query=${encodeURIComponent(query)}&api_key=${API_KEY}&language=es-MX`);
  const data = await res.json();

  if (!data.results || !data.results.length) {
    resultados.innerHTML = '<p>No se encontraron resultados.</p>';
    return;
  }

  data.results.forEach(item => {
    const poster = item.poster_path
      ? `https://image.tmdb.org/t/p/w154${item.poster_path}`
      : 'https://via.placeholder.com/154x231?text=Sin+Imagen';
    const nombre = item.title || item.name;

    const div = document.createElement('div');
    div.className =
'poster-card cursor-pointer text-center bg-slate-900 rounded-xl p-2 border border-slate-700 hover:border-blue-500';
    div.innerHTML = `
      <img src="${poster}" alt="${nombre}" class="rounded w-full mb-1">
      <p class="text-xs font-semibold">${nombre}</p>
    `;
    div.onclick = () => seleccionar(item, tipoSeleccionado);
    resultados.appendChild(div);
  });

  document.getElementById('seleccion').classList.add('hidden');
  document.getElementById('salida').value = '';
}

async function seleccionar(item, tipo) {
  document.getElementById('resultados').innerHTML = '';

  const seleccionDiv = document.getElementById('seleccion');
  seleccionDiv.classList.remove('hidden');

  const imgSrc = item.poster_path
    ? `https://image.tmdb.org/t/p/w500${item.poster_path}`
    : 'https://via.placeholder.com/500x750?text=Sin+Imagen';
  const imagenSeleccion = document.getElementById('imagenSeleccion');
  imagenSeleccion.src = imgSrc;
  imagenSeleccion.alt = item.title || item.name;

  document.getElementById('movieId').value = item.id;
  document.getElementById('tipoSeleccion').value = tipo === 'movie' ? 'Película' : 'Serie';

  document.getElementById('temporadaBox').classList.add('hidden');
}

function normalizarClasificacion(certRaw) {
  if (!certRaw) return "NR";

  } else if (/^B15$/i.test(certRaw)) {
    edad = "15+";
  } else if (/^C$/i.test(certRaw)) {
    edad = "18+";
  } else if (/^D$/i.test(certRaw)) {
    edad = "18+ (Explícito)";
  } else if (/^\d+$/.test(certRaw)) {
    edad = `${certRaw}+`; // Solo número
  } else if (/PG-?13/i.test(certRaw)) {
    edad = "13+";
  } else if (/R|18/i.test(certRaw)) {
    edad = "18+";
  } else if (/PG/i.test(certRaw)) {
    edad = "10+";
  } else if (/G/i.test(certRaw)) {
    edad = "Todas las edades"; // G (USA) → General
  } else {
    edad = certRaw !== "" ? certRaw : "NR";
  }
}

let previewItems = [];


// ======================================================
// AGREGAR RESULTADOS SELECCIONADOS AL PREVIEW
// ======================================================


function agregarAlPreview() {

    const seleccionados =
        document.querySelectorAll(
            "#carouselResultados .carouselCheck:checked"
        );

    if (seleccionados.length === 0) {

        alert("Selecciona al menos un elemento.");

        return;
    }


    // =========================================
    // CONFIGURACIÓN ACTUAL
    // =========================================

    const formato =
        document.getElementById("carouselFormato").value;

    const tituloCarrusel =
        document.getElementById("carouselTitulo").value ||
        "Nuevo Carrusel";

    const carpeta =
        document.getElementById("carouselCarpeta").value;


    // =========================================
    // CONTENEDOR DEL PREVIEW
    // =========================================

    const preview =
        document.getElementById("carouselPreview");


    // =========================================
    // ASEGURAR QUE EXISTE LA LISTA
    // =========================================

    if (!window.carouselPreviewItems) {

        window.carouselPreviewItems = [];

    }


    let agregados = 0;
    let repetidos = 0;


    // =========================================
    // RECORRER SELECCIONADOS
    // =========================================

    seleccionados.forEach(check => {

        const item =
            check.closest(".flex.items-center");


        if (!item) return;


        const slug =
            item.dataset.slug;

        const imagen =
            item.dataset.imagen;

        const tmdbId =
            item.dataset.tmdbid;


        if (!slug || !imagen) return;


        // =====================================
        // ID ÚNICO
        // =====================================

        const identificador =
            tmdbId ||
            slug;


        // =====================================
        // EVITAR DUPLICADOS
        // =====================================

        const existe =
            window.carouselPreviewItems.some(
                elemento =>
                    elemento.id === identificador
            );


        if (existe) {

            repetidos++;

            return;

        }


        // =====================================
        // GUARDAR ELEMENTO
        // =====================================

        window.carouselPreviewItems.push({

            id: identificador,

            slug: slug,

            imagen: imagen,

            carpeta: carpeta

        });


        agregados++;

    });


    // =========================================
    // ACTUALIZAR PREVIEW
    // =========================================

    renderizarPreview();


    // =========================================
    // MENSAJE
    // =========================================

    if (agregados > 0) {

        if (repetidos > 0) {

            alert(
                `${agregados} agregado(s). ` +
                `${repetidos} ya estaban en el preview.`
            );

        } else {

            alert(
                `${agregados} elemento(s) agregado(s) al preview.`
            );

        }

    } else {

        alert(
            "Los elementos seleccionados ya están en el preview."
        );

    }

}




// ======================================================
// MOSTRAR PREVIEW
// ======================================================


function renderizarPreview() {

    const preview =
        document.getElementById("carouselPreview");

    const contador =
        document.getElementById("previewContador");


    if (!preview) return;


    const formato =
        document.getElementById("carouselFormato").value;


    // =========================================
    // LIMPIAR
    // =========================================

    preview.innerHTML = "";


    // =========================================
    // CLASE DEL CARRUSEL
    // =========================================

    if (formato === "poster") {

        preview.className =
            "scroll-container";

    } else {

        preview.className =
            "horizontal-scroll-container";

    }


    // =========================================
    // MOSTRAR ELEMENTOS
    // =========================================

    window.carouselPreviewItems.forEach(
        (item, index) => {

            const a =
                document.createElement("a");


            a.href =
                `${item.carpeta}${item.slug}.html`;


            // =====================================
            // IMAGEN
            // =====================================

            const img =
                document.createElement("img");


            img.src =
                item.imagen;

            img.alt =
                item.slug;


            img.className =
                "lazy-img";


            // =====================================
            // BOTÓN ELIMINAR
            // =====================================

            const boton =
                document.createElement("button");


            boton.className =
                "preview-remove";


            boton.type =
                "button";


            boton.innerHTML =
                "×";


            boton.onclick =
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    window.carouselPreviewItems
                        .splice(index, 1);


                    renderizarPreview();

                };


            // =====================================
            // ARMAR TARJETA
            // =====================================

            a.appendChild(img);

            a.appendChild(boton);

            preview.appendChild(a);

        }
    );


    // =========================================
    // CONTADOR
    // =========================================

    if (contador) {

        const cantidad =
            window.carouselPreviewItems.length;


        contador.textContent =
            `${cantidad} elemento${cantidad === 1 ? "" : "s"}`;

    }

}




// ======================================================
// VACIAR PREVIEW
// ======================================================

function vaciarPreview() {

    if (previewItems.length === 0) {

        return;

    }


    previewItems = [];


    renderizarPreview();

}

async function generarCarrusel() {

    const tipo =
        document.getElementById("carouselTipo").value;


    const modo =
        document.getElementById("carouselModo").value;


    const busqueda =
        document.getElementById("carouselBusqueda").value.trim();

        document.getElementById("carouselGenero").value;

        document.getElementById("carouselFormato").value;


    const cantidad =
        parseInt(
            document.getElementById("carouselCantidad").value
        ) || 20;


    const carpeta =
        document.getElementById("carouselCarpeta").value;


    const contenedor =
        document.getElementById("carouselResultados");


    contenedor.innerHTML = `
        <div class="text-center p-6 text-slate-300">
            Buscando contenido...
        </div>
    `;

    // VALIDAR BÚSQUEDA
    // ==========================================

    if (modo === "search" && !busqueda) {

        contenedor.innerHTML = "";

        alert(
            "Escribe el nombre de una película o serie."
        );

        return;

    }


    // ==========================================
    // GÉNEROS SERIES
    // ==========================================

    if (tipo === "tv") {

        const generosTV = {

            "28": "10759",
            "12": "10759",
            "16": "16",
            "35": "35",
            "80": "80",
            "18": "18",
            "27": "9648",
            "878": "10765"

        };


        genero =
            generosTV[genero] || genero;

    }


    let resultados = [];


    // ==========================================
    // 🔎 BUSCAR POR NOMBRE
    // ==========================================

    if (modo === "search") {

        const url =
            `https://api.themoviedb.org/3/search/${tipo}` +
            `?api_key=${API_KEY}` +
            `&language=es-MX` +
            `&query=${encodeURIComponent(busqueda)}` +
            `&include_adult=false` +
            `&page=1`;


        try {

            const res =
                await fetch(url);


            if (!res.ok) {

                throw new Error(
                    "Error al consultar TMDB."
                );

            }


            const data =
                await res.json();


            resultados =
                data.results || [];


        } catch (error) {

            console.error(error);


            contenedor.innerHTML = `
                <div class="text-center p-6 text-red-400">
                    Error al buscar en TMDB.
                </div>
            `;

            return;

        }

    }


    // ==========================================
    // 🔀 MODO ALEATORIO
    // ==========================================

    else {

        let filtroColeccion = "";


        // ======================================
        // PELÍCULAS
        // ======================================

        if (tipo === "movie") {

            if (carpeta === "Marvel/") {

                filtroColeccion =
                    "&with_keywords=180547";

            }


            if (carpeta === "DC/") {

                filtroColeccion =
                    "&with_companies=9993";

            }


            if (carpeta === "Disney/") {

                filtroColeccion =
                    "&with_companies=2";

            }


            if (carpeta === "Harry-Potter/") {

                filtroColeccion =
                    "&with_keywords=818";

            }


            if (carpeta === "Star-Wars/") {

                filtroColeccion =
                    "&with_companies=1";

            }


            if (carpeta === "Anime/") {

                filtroColeccion =
                    "&with_original_language=ja";

            }


            if (carpeta === "Peliculas/") {

                filtroColeccion =
                    "&without_keywords=180547|849";

            }

        }


        // ======================================
        // SERIES
        // ======================================

        if (tipo === "tv") {

            if (carpeta === "Marvel/") {

                filtroColeccion =
                    "&with_companies=420";

            }


            if (carpeta === "DC/") {

                filtroColeccion =
                    "&with_networks=71|3186";

            }


            if (carpeta === "Disney/") {

                filtroColeccion =
                    "&with_networks=2739";

            }


            if (carpeta === "Star-Wars/") {

                filtroColeccion =
                    "&with_networks=2739";

            }


            if (carpeta === "Anime/") {

                filtroColeccion =
                    "&with_original_language=ja";

            }


            if (carpeta === "Doramas/") {

                filtroColeccion =
                    "&with_original_language=ko";

            }

        }


        // ======================================
        // PÁGINA ALEATORIA
        // ======================================

        const paginaAleatoria =
            Math.floor(Math.random() * 10) + 1;


        const url =
            `https://api.themoviedb.org/3/discover/${tipo}` +
            `?api_key=${API_KEY}` +
            `&language=es-MX` +
            `&sort_by=popularity.desc` +
            `&with_genres=${genero}` +
            `${filtroColeccion}` +
            `&page=${paginaAleatoria}`;


        try {

            const res =
                await fetch(url);


            if (!res.ok) {

                throw new Error(
                    "Error al consultar TMDB."
                );

            }


            const data =
                await res.json();


            resultados =
                data.results || [];


            // Mezclar
            resultados.sort(
                () => Math.random() - 0.5
            );


        } catch (error) {

            console.error(error);


            contenedor.innerHTML = `
                <div class="text-center p-6 text-red-400">
                    Error al obtener contenido de TMDB.
                </div>
            `;

            return;

        }

    }


    // ==========================================
    // FILTRAR IMÁGENES
    // ==========================================

    resultados =
        resultados.filter(item => {

            if (formato === "poster") {

                return !!item.poster_path;

            }


            return !!item.backdrop_path;

        });


    // ==========================================
    // CANTIDAD
    // ==========================================

    resultados =
        resultados.slice(0, cantidad);


    contenedor.innerHTML = "";


    // ==========================================
    // MOSTRAR RESULTADOS
    // ==========================================

    for (const item of resultados) {

    const titulo =
        item.title ||
        item.name ||
        "Sin título";

    const slug =
        generarSlug(titulo);

    let imagen = "";

    // =========================================
    // 🖼️ POSTER
    // =========================================

    if (formato === "poster") {

        if (!item.poster_path) continue;

        imagen =
            `https://image.tmdb.org/t/p/w500${item.poster_path}`;

    }

    // =========================================
    // 🎬 LANDSCAPE
    // Buscar backdrop con idioma
    // =========================================

    else {

        try {

            const imagesUrl =
                `https://api.themoviedb.org/3/${tipo}/${item.id}/images` +
                `?api_key=${API_KEY}`;

            const imagesRes =
                await fetch(imagesUrl);

            const imagesData =
                await imagesRes.json();

            const backdrops =
                imagesData.backdrops || [];


            // =====================================
            // PRIORIDAD DE IDIOMAS
            // 1. Español México
            // 2. Español
            // 3. Inglés
            // 4. Sin idioma
            // =====================================

            let backdrop =
                backdrops.find(img =>
                    img.iso_639_1 === "es-MX"
                );


            if (!backdrop) {

                backdrop =
                    backdrops.find(img =>
                        img.iso_639_1 === "es"
                    );

            }


            if (!backdrop) {

                backdrop =
                    backdrops.find(img =>
                        img.iso_639_1 === "en"
                    );

            }


            // =====================================
            // Si no existe con idioma,
            // permitir uno sin idioma
            // como último recurso
            // =====================================

            if (!backdrop) {

                backdrop =
                    backdrops.find(img =>
                        img.iso_639_1 === null
                    );

            }


            if (!backdrop) continue;


            imagen =
                `https://image.tmdb.org/t/p/original${backdrop.file_path}`;

        }

        catch (error) {

            console.warn(
                "No se pudieron obtener imágenes de:",
                titulo,
                error
            );

            continue;

        }

    }


    // =========================================
    // CREAR RESULTADO
    // =========================================

    const div =
        document.createElement("div");


    div.className =
        "flex items-center gap-3 bg-slate-900 p-2 rounded";


    div.dataset.slug = slug;
div.dataset.imagen = imagen;
div.dataset.tmdbid = item.id;


    div.innerHTML = `

        <input
            type="checkbox"
            class="carouselCheck"
            checked
        >

        <img
            src="${imagen}"
            class="w-16 rounded"
        >

        <div class="flex-1">

            <div class="font-semibold">
                ${escapeHTML(titulo)}
            </div>

            <div class="text-xs text-slate-400">
                ${carpeta}${slug}.html
            </div>

        </div>

    `;


    contenedor.appendChild(div);

}


    // ==========================================
    // SIN RESULTADOS
    // ==========================================

    if (!resultados.length) {

        contenedor.innerHTML = `

            <div class="text-center p-6 text-slate-400">

                No se encontraron resultados.

            </div>

        `;

    }

}



function copiarTexto() {
  const salida = document.getElementById('salida');
  if (!salida.value.trim()) {
    alert("No hay texto para copiar.");
    return;
  }
  salida.select();
  salida.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(salida.value).then(() => {
    alert("Texto copiado al portapapeles.");
  }).catch(() => {
    alert("Error al copiar. Usa Ctrl+C.");
  });
}
