<script>

function cambiarGenerador(tab) {

    // ==========================================
    // OCULTAR TODOS
    // ==========================================

    document
        .querySelectorAll(".generator-section")
        .forEach(section => {

            section.classList.add("hidden");

        });


    // ==========================================
    // DESACTIVAR TODAS LAS PESTAÑAS
    // ==========================================

    document
        .querySelectorAll(".generator-tab")
        .forEach(button => {

            button.classList.remove("active");

        });


    // ==========================================
    // MOSTRAR SECCIÓN SELECCIONADA
    // ==========================================

    const seccion =
    document.getElementById(
        "generador-" +
        (
            tab === "plantillas"
                ? "plantillas"
                : tab === "carrusel"
                    ? "carrusel"
                    : tab === "top10"
                        ? "top10"
                        : "swiper"
        )
    );


    if (seccion) {

        seccion.classList.remove("hidden");

    }


    // ==========================================
    // ACTIVAR PESTAÑA
    // ==========================================

    const boton =
        document.querySelector(
            `.generator-tab[data-tab="${tab}"]`
        );


    if (boton) {

        boton.classList.add("active");

    }

}

</script>
